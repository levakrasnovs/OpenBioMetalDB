    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

    <symbol id="mouse" viewBox="0 0 600 340">

        <circle cx="574" cy="196" r="6" fill="var(--pink-d)"/>

          <path d="M560,200 L600,192"/><path d="M560,204 L602,206"/><path d="M558,208 L596,220"/>
